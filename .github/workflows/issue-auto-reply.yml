name: "AzfarBot - Issue Auto Reply"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AzfarBot Token
        id: azfarbot
        if: ${{ secrets.AZFARBOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AZFARBOT_APP_ID }}
          private-key: ${{ secrets.AZFARBOT_PRIVATE_KEY }}

      - name: Reply to new issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.azfarbot.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.issue.user.login;
            const issueNumber = context.payload.issue.number;

            const commentBody = `### 🪐 Greetings @${author}!

            Thank you for opening this issue in **OOTD (Outfit Of The Day)**. ✦

            Our maintainer **@mdazfar2** and the team have received your report. We will review the details and get back to you shortly.

            In the meantime, please ensure you have provided all relevant details, reproduction steps, and screenshots so we can assist you quickly.

            > *“Your Style, Written In the Stars.”*
            > — **AzfarBot** 🤖✨`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });
