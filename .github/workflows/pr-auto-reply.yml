name: "AzfarBot - PR Auto Reply"

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AzfarBot Token
        id: azfarbot
        if: ${{ secrets.AZFARBOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AZFARBOT_APP_ID }}
          private-key: ${{ secrets.AZFARBOT_PRIVATE_KEY }}

      - name: Reply to new pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.azfarbot.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            const commentBody = `### 🪐 Welcome to the Cosmos, @${author}!

            Thank you for submitting this Pull Request to **OOTD (Outfit Of The Day)**! ✦

            Our maintainer **@mdazfar2** has been notified and will review your changes shortly.

            **Quick Verification Checklist:**
            - [ ] Adheres to our [Contributing Guidelines](https://github.com/mdazfar2/Outfit-of-the-day/blob/main/CONTRIBUTING.md) and [Code of Conduct](https://github.com/mdazfar2/Outfit-of-the-day/blob/main/CODE_OF_CONDUCT.md)
            - [ ] Built and verified locally (\`npm run build\` & \`npm run lint\`)
            - [ ] Linked any corresponding issue in the description

            We appreciate your time and contribution to making OOTD extraordinary! 🚀

            > *“Your Style, Written In the Stars.”*
            > — **AzfarBot** 🤖✨`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
